
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMaster - Interactive Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Quiz<span>Master</span></h1>
            <p>Challenge your knowledge!</p>
        </header>

        <!-- Welcome Screen -->
        <section id="welcome-screen" class="screen">
            <div class="welcome-icon">🧠</div>
            <h2>Welcome to QuizMaster!</h2>
            <p>Test your knowledge with our interactive quiz.</p>
            <p class="info">10 Questions | Multiple Choice | Instant Results</p>
            <button id="start-btn" class="primary-btn">Start Quiz</button>
        </section>

        <!-- Quiz Screen -->
        <section id="quiz-screen" class="screen hidden">

            <div class="quiz-top">
                <span id="question-count">Question 1 of 10</span>
                <span id="score-display">Score: 0</span>
            </div>

            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>

            <h2 id="question">Question appears here</h2>

            <div id="options-container" class="options">
            </div>

            <p id="feedback"></p>

            <button id="next-btn" class="primary-btn hidden">
                Next Question
            </button>

        </section>

        <!-- Result Screen -->
        <section id="result-screen" class="screen hidden">
            <div class="result-icon">🏆</div>
            <h2>Quiz Completed!</h2>

            <div class="result-circle">
                <span id="final-score">0/10</span>
            </div>

            <h3 id="result-message">Good Job!</h3>
            <p id="percentage">Your score: 0%</p>

            <button id="restart-btn" class="primary-btn">
                Play Again
            </button>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
